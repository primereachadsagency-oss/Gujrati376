<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gujarati Trader™</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Container Card */
    .card-container {
      background-color: #121318;
      border: 1.5px solid #d4af37;
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0px 0px 25px rgba(212, 175, 55, 0.15);
      position: relative;
    }

    /* Logo Area */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #3a3f4d 0%, #1a1c23 100%);
      border: 2px solid #ffd700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .logo-text-guj {
      color: #e0e0e0;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .logo-text-eng {
      color: #00e676;
      font-size: 0.75rem;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .crown {
      font-size: 1.2rem;
      margin: 2px 0;
    }

    .title {
      font-size: 1.6rem;
      color: #ffcc00;
      font-weight: 800;
      text-transform: lowercase;
    }

    .subtitle {
      color: #a0a5b5;
      font-size: 0.9rem;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    /* Badges & Tags */
    .badge-members {
      background-color: #1a1c23;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 12px;
    }

    .highlight-green {
      color: #00e676;
      font-weight: 700;
    }

    .tags-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .tag {
      background-color: #1a1c23;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: #b0b5c0;
    }

    /* Telegram Glowing Button */
    .telegram-btn {
      display: block;
      width: 100%;
      background-color: #0099ff;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 25px;
      margin-bottom: 22px;
      box-shadow: 0 0 20px rgba(0, 153, 255, 0.6);
      animation: pulse-glow 2s infinite alternate;
      transition: transform 0.2s ease;
    }

    .telegram-btn:hover {
      transform: scale(1.02);
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 12px rgba(0, 153, 255, 0.4);
      }
      100% {
        box-shadow: 0 0 24px rgba(0, 153, 255, 0.9);
      }
    }

    /* Features List */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .feature-item {
      background-color: #17181f;
      border: 1px solid #242735;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.9rem;
      color: #e0e0e0;
    }

    .check-icon {
      color: #00e676;
      margin-right: 8px;
      font-weight: bold;
    }

    .tagline {
      color: #00aaff;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Footer Links & Modals */
    .footer-links {
      font-size: 0.75rem;
      color: #6c727f;
    }

    .footer-links button {
      background: none;
      border: none;
      color: #8a90a0;
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
    }

    .footer-links button:hover {
      color: #ffffff;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
    }

    .modal-content {
      background-color: #1a1c23;
      margin: 15% auto;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 16px;
      width: 85%;
      max-width: 400px;
      color: #ccc;
      text-align: left;
      line-height: 1.5;
    }

    .modal-content h2 {
      color: #ffcc00;
      margin-bottom: 12px;
      font-size: 1.2rem;
    }

    .close-btn {
      color: #aaa;
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Profile Logo -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <span class="logo-text-guj">ગુજરાતી</span>
        <span class="logo-text-eng">TRADER</span>
      </div>
    </div>

    <!-- Title & Crown -->
    <div class="crown">👑</div>
    <h1 class="title">gujarati trader™</h1>
    <div class="crown">👑</div>
    <p class="subtitle">✓ Trusted learning community</p>

    <!-- Active Members Count with Animation ID -->
    <div class="badge-members">
      👥 Active Members: <span id="memberCounter" class="highlight-green">0</span>
    </div>

    <!-- Features Badges -->
    <div class="tags-row">
      <span class="tag">24/7 Updates</span>
      <span class="tag">Free to Join</span>
    </div>

    <!-- Telegram Button with Updated Link -->
    <a href="https://t.me/+mVDd7KcIWikzYTNl" target="_blank" class="telegram-btn">
      🚀 Join on Telegram +
    </a>

    <!-- Points -->
    <div class="feature-list">
      <div class="feature-item">
        <span class="check-icon">✓</span> Market Insights & Discussions
      </div>
      <div class="feature-item">
        <span class="check-icon">✓</span> Learn with Experts
      </div>
      <div class="feature-item">
        <span class="check-icon">✓</span> Practical Strategies
      </div>
    </div>

    <p class="tagline">⚡ Stay Ahead with Smart Learning</p>

    <!-- Footer Links -->
    <div class="footer-links">
      <button onclick="openModal('about')">About</button> | 
      <button onclick="openModal('terms')">Terms</button> | 
      <button onclick="openModal('contact')">Contact Us</button> | 
      <button onclick="openModal('disclaimer')">Disclaimer</button>
    </div>

  </div>

  <!-- Popup Modal -->
  <div id="popupModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Title</h2>
      <div id="modalBody">Body Content</div>
    </div>
  </div>

  <script>
    // Counting Animation Logic
    function animateCounter(targetNumber, duration) {
      const counterElement = document.getElementById("memberCounter");
      let startTimestamp = null;

      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        
        // Easing function for smooth slowdown near the end
        const easeOutProgress = 1 - Math.pow(1 - progress, 3);
        const currentCount = Math.floor(easeOutProgress * targetNumber);
        
        // Format with comma separation (e.g., 100,003)
        counterElement.innerText = currentCount.toLocaleString();

        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          counterElement.innerText = targetNumber.toLocaleString();
        }
      }

      window.requestAnimationFrame(step);
    }

    // Run animation on page load (100,003 target over 2.5 seconds)
    window.addEventListener("DOMContentLoaded", () => {
      animateCounter(100003, 2500);
    });

    // Modal Data
    const modalData = {
      about: {
        title: "About Us",
        content: "Gujarati Trader™ is an educational community focused on providing market insights, learning resources, and practical strategies for trading enthusiasm."
      },
      terms: {
        title: "Terms & Conditions",
        content: "By joining this channel, you agree that all shared insights are strictly for educational and informational purposes only."
      },
      contact: {
        title: "Contact Us",
        content: "For inquiries and support, please reach out via Telegram direct message to our official admin handle."
      },
      disclaimer: {
        title: "Disclaimer",
        content: "We are not SEBI-registered advisors. Stock market trading and investments carry financial risk. Always consult a certified financial advisor before making any investment decisions."
      }
    };

    function openModal(type) {
      const modal = document.getElementById("popupModal");
      document.getElementById("modalTitle").innerText = modalData[type].title;
      document.getElementById("modalBody").innerText = modalData[type].content;
      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("popupModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("popupModal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };
  </script>
</body>
</html>
